name: Build PassWall2 Slim

on:
  repository_dispatch:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  passwall2: ${{ github.repository }}

jobs:
  job_check:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      passwall2_version: ${{ steps.check_version.outputs.latest_version }}
      has_update: ${{ steps.check_version.outputs.has_update }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version
        id: check_version
        env:
          url_tags: https://api.github.com/repos/${{ env.passwall2 }}/releases/latest
        run: |
          cd luci-app-passwall2
          latest_version=$(awk -F ':=' '/^PKG_VERSION:=|^PKG_RELEASE:=/ {print $2}' Makefile | sed ':a;N;s/\$(PKG_VERSION)-//;s/\n$//;s/\n/-/;ba')
          echo "latest_version=${latest_version}" >> $GITHUB_OUTPUT
          
          remote_latest_version=$(wget -qO- -t1 -T2 ${{env.url_tags}} | jq -r '.tag_name' 2>/dev/null || echo "")
          if [ -z "$remote_latest_version" ] || [ "$remote_latest_version" = "null" ]; then
            echo "has_update=true" >> $GITHUB_OUTPUT
          elif [ "$latest_version-slim" = "$remote_latest_version" ]; then
            echo "has_update=false" >> $GITHUB_OUTPUT
          else
            echo "has_update=true" >> $GITHUB_OUTPUT
          fi

  job_build:
    name: Build (${{ matrix.platform }})
    needs: job_check
    if: needs.job_check.outputs.has_update == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64
            url_sdk: https://downloads.openwrt.org/snapshots/targets/x86/64/openwrt-sdk-x86-64_gcc-14.4.0_musl.Linux-x86_64.tar.zst
          - platform: aarch64_cortex-a53
            url_sdk: https://downloads.openwrt.org/snapshots/targets/mediatek/filogic/openwrt-sdk-mediatek-filogic_gcc-14.4.0_musl.Linux-x86_64.tar.zst

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex gawk gcc-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zstd upx
          sudo -E apt-get -qq clean

      - name: Download & Extract OpenWrt SDK
        run: |
          wget ${{ matrix.url_sdk }} -O sdk.tar.zst
          mkdir sdk
          tar --zstd -x -f sdk.tar.zst -C ./sdk --strip-components=1

      - name: Update Feeds
        run: |
          cd sdk
          cat > feeds.conf.default <<EOF
          src-git packages https://github.com/openwrt/packages.git
          src-git luci https://github.com/openwrt/luci.git
          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-link passwall2 $GITHUB_WORKSPACE/luci-app-passwall2
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Run Private Slimming Script
        run: |
          chmod +x private.sh
          ./private.sh

      - name: Configure .config
        run: |
          cd sdk
          echo "CONFIG_ALL_NONSHARED=n" > .config
          echo "CONFIG_ALL_KMODS=n" >> .config
          echo "CONFIG_ALL=n" >> .config
          
          # 【關鍵】啟用 LuCI 語言包生成開關
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
          echo "CONFIG_LUCI_LANG_zh_Hant=y" >> .config
          
          echo "CONFIG_PACKAGE_luci-app-passwall2=m" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-passwall2-zh-cn=m" >> .config
          echo "CONFIG_PACKAGE_xray-core=m" >> .config
          echo "CONFIG_PACKAGE_v2ray-geodata=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Xray=y" >> .config
          
          # 停用非必要組件
          echo "# CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_ChinaDNS_NG is not set" >> .config
          echo "# CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Sing_Box is not set" >> .config
          echo "# CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_V2ray_Plugin is not set" >> .config
          
          make defconfig

      - name: Compile Packages
        run: |
          cd sdk
          make package/luci-app-passwall2/compile -j$(nproc) V=s || make package/luci-app-passwall2/compile -j1 V=s
          make package/xray-core/compile -j$(nproc) V=s || make package/xray-core/compile -j1 V=s
          make package/v2ray-geodata/compile -j$(nproc) V=s || make package/v2ray-geodata/compile -j1 V=s

      - name: Organize Artifacts
        run: |
          cd sdk
          mkdir -p tmp_upload upload
          
          # 收集編譯好的 APK/IPK
          find bin/ -type f \( -name "luci-app-passwall2*" -o -name "luci-i18n-passwall2*" -o -name "xray-core*" -o -name "v2ray-geodata*" -o -name "ca-bundle*" -o -name "coreutils-timeout*" \) -exec cp {} tmp_upload/ \;
          
          pkg_count=$(ls -1 tmp_upload/* 2>/dev/null | wc -l)
          ZIP_NAME="passwall2_slim_${{ matrix.platform }}.zip"

          if [ "$pkg_count" -gt 0 ]; then
            zip -jr upload/$ZIP_NAME tmp_upload/*
          else
            echo "Error: No target ipk/apk files found!" > tmp_upload/README.txt
            zip -jr upload/$ZIP_NAME tmp_upload/*
          fi

          # 生成 Release Markdown 描述檔 (含壓縮包檔名清單)
          cat <<EOF > upload/release_note_${{ matrix.platform }}.md
          ### 📦 平台架構: \`${{ matrix.platform }}\`
          
          **壓縮包內包含的檔案數：** \`$pkg_count\`
          
          **檔案詳細清單：**
          \`\`\`text
          $(unzip -l upload/$ZIP_NAME | tail -n +4)
          \`\`\`
          EOF

      - name: Upload Packages to Release
        uses: softprops/action-gh-release@v2.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.job_check.outputs.passwall2_version }}-slim
          files: sdk/upload/*.zip
          body_path: sdk/upload/release_note_${{ matrix.platform }}.md
          append_body: true
          overwrite_files: true
