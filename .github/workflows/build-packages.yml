name: Sync & Build Slim Packages

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '30 0 * * *' # 每天 UTC 00:30 自動觸發
  workflow_dispatch:

jobs:
  sync-and-build:
    name: Sync, Slim and Build (${{ matrix.target.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          # ZN M2 (aarch64) 目標架構
          - arch: aarch64_generic
            sdk_ver: "24.10.0"  # 產出 .ipk
          - arch: aarch64_generic
            sdk_ver: "SNAPSHOT" # 產出 .apk (OpenWrt 25+)

    steps:
      # 1. 自動同步 Upstream 上游最新代碼並推回倉庫
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync & Push Upstream
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/Openwrt-Passwall/openwrt-passwall2.git || true
          git fetch upstream
          # 嘗試 Merge upstream，若成功則推回 origin
          if git merge upstream/main --no-edit || git merge upstream/master --no-edit; then
            git push origin HEAD:${{ github.ref_name }} || true
          fi

      # 2. 準備 SDK 環境與 UPX 壓縮工具
      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl

      - name: Setup OpenWrt SDK
        uses: openwrt/gh-action-sdk@v7
        with:
          architecture: ${{ matrix.target.arch }}
          sdk_version: ${{ matrix.target.sdk_ver }}

      # 3. 準備 SDK Feeds 與依賴套件 (複製源碼至 SDK)
      - name: Prepare SDK Packages
        run: |
          cd $SDK_HOME
          # 1. 複製 PassWall2 主包與依賴包到 SDK 的 package 目錄
          cp -rb $GITHUB_WORKSPACE/luci-app-passwall2 package/
          cp -rb $GITHUB_WORKSPACE/passwall-depends package/ || true
          
          # 2. 更新並安裝 SDK Feeds (確保依賴鏈完整)
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 4. 關鍵步驟：在 SDK 目錄下執行自訂的 private.sh 進行動態瘦身
      - name: Run Private Slimming Script
        run: |
          cd $SDK_HOME
          # 複製並執行 private.sh 腳本
          cp $GITHUB_WORKSPACE/private.sh ./private.sh
          chmod +x ./private.sh
          ./private.sh

      # 5. 在 SDK 目錄下執行精簡後的二進位套件編譯
      - name: Compile Slim Packages
        run: |
          cd $SDK_HOME
          make defconfig
          make package/luci-app-passwall2/compile V=s

      # 6. 整理並上傳產出的 ipk / apk 檔案
      - name: Organize Artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/bin-packages
          find $SDK_HOME/bin/ -type f \( -name "*.ipk" -o -name "*.apk" \) -exec cp {} $GITHUB_WORKSPACE/bin-packages/ \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PassWall2-Slim-${{ matrix.target.arch }}-${{ matrix.target.sdk_ver }}
          path: bin-packages/*
