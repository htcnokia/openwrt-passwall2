name: "Auto compile Slim PassWall2 with SDK"

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  TZ: Asia/Shanghai
  passwall2: ${{ github.repository }}
  packages: Openwrt-Passwall/openwrt-passwall-packages
  # 【精簡1】只保留最核心的組件，剔除 naiveproxy / hysteria / shadowsocks 等重型二進位
  package_names: "chinadns-ng geoview tcping v2ray-geodata xray-core"
  package_release: "chinadns-ng geoview tcping v2ray-geoip v2ray-geosite xray-core"

permissions:
  contents: write
  actions: write

jobs:
  job_check:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      passwall2_version: ${{ steps.check_version.outputs.latest_version }}
      has_update: ${{ steps.check_version.outputs.has_update }}
      prerelease: ${{ steps.check_version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Check version
        id: check_version
        env:
          url_tags: https://api.github.com/repos/${{ env.passwall2 }}/releases/latest
        run: |
          latest_version=$(awk -F ':=' '/^PKG_VERSION:=|^PKG_RELEASE:=/ {print $2}' Makefile 2>/dev/null || echo "1.0.0")
          echo "latest_version=${latest_version}" >> $GITHUB_OUTPUT
          echo "prerelease=false" >> $GITHUB_OUTPUT
          echo "has_update=true" >> $GITHUB_OUTPUT

  job_auto_compile:
    needs: job_check
    runs-on: ubuntu-latest
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 【精簡2】只專注編譯 arm64 (適用於中興 ZN M2 等主流 ARM64 路由器)
          - platform: aarch64_cortex-a53
            url_sdk: https://downloads.openwrt.org/snapshots/targets/mediatek/filogic/openwrt-sdk-mediatek-filogic_gcc-14.4.0_musl.Linux-x86_64.tar.zst
            ver: "ipk"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialization Environment
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential git wget curl unzip upx-ucl zstd
          sudo -E apt-get -qq clean

      - name: Download & Extract OpenWrt SDK
        run: |
          wget ${{ matrix.url_sdk }} -O sdk.tar.zst
          mkdir sdk
          tar --zstd -x -f sdk.tar.zst -C ./sdk --strip-components=1
          cd sdk
          
          # 更新 Feeds 源
          sed -i \
              -e 's|git\.openwrt\.org/feed|github.com/openwrt|g' \
              -e 's|git\.openwrt\.org/project|github.com/openwrt|g' \
              -e 's|git\.openwrt\.org/openwrt|github.com/openwrt|g' \
              "feeds.conf.default"

          cat > feeds.tmp <<'EOF'
          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          EOF
          cat feeds.conf.default >> feeds.tmp
          mv feeds.tmp feeds.conf.default

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 【關鍵核心】：在編譯前注入你的 private.sh 進行 UPX 瘦身修補！
      - name: Apply Private Slim & UPX Script
        run: |
          # 將目前倉庫的 PassWall2 拷貝到 SDK 的 package 目錄
          mkdir -p sdk/package/luci-app-passwall2
          cp -rf Makefile Config-build.in root luci-app-passwall2/ 2>/dev/null || cp -rf ./* sdk/package/luci-app-passwall2/ 2>/dev/null || true
          
          # 執行 private.sh 瘦身腳本
          if [ -f "private.sh" ]; then
            chmod +x private.sh
            cd sdk
            ../private.sh
            cd ..
          fi

      - name: Configure .config
        run: |
          cd sdk
          echo "CONFIG_ALL_NONSHARED=n" > .config
          echo "CONFIG_ALL_KMODS=n" >> .config
          echo "CONFIG_ALL=n" >> .config
          echo "CONFIG_PACKAGE_luci-app-passwall2=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Xray=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_ChinaDNS_NG=y" >> .config
          make defconfig

      - name: Compile Passwall2 & Packages
        run: |
          cd sdk
          # 1. 編譯依賴包
          for package in ${{ env.package_names }}; do
              if [ -d "feeds/passwall_packages/$package" ]; then
                  echo "----------- Begin Compiling $package ---------------"
                  make package/$package/compile -j$(nproc) V=s || make package/$package/compile -j1 V=s
              fi
          done
          
          # 2. 編譯 PassWall2 主套件
          make package/luci-app-passwall2/compile -j$(nproc) V=s || make package/luci-app-passwall2/compile -j1 V=s

      - name: Organize Artifacts
        run: |
          cd sdk
          mkdir -p tmp_upload upload
          
          # 1. 廣泛搜尋 bin/ 目錄下所有生成出的 .ipk 檔案，並複製到 tmp_upload
          find bin/ -type f -name "*.ipk" -exec cp {} tmp_upload/ \;
          
          # 2. 檢查是否有收集到 .ipk 檔案
          ipk_count=$(ls -1 tmp_upload/*.ipk 2>/dev/null | wc -l)
          echo "Found $ipk_count .ipk files."

          if [ "$ipk_count" -gt 0 ]; then
            # 如果有檔案，正常打包
            zip -jr upload/passwall2_slim_${{ matrix.platform }}.zip tmp_upload/*
          else
            # 如果沒有檔案，生成一個说明文件避免 zip 報錯，並在日誌提醒
            echo "Warning: No ipk files found!" > tmp_upload/README.txt
            zip -jr upload/passwall2_slim_${{ matrix.platform }}.zip tmp_upload/*
          fi

          echo "FIRMWARE=$PWD/upload" >> $GITHUB_ENV

      - name: Upload IPKs to Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.job_check.outputs.passwall2_version }}-slim
          files: ${{ env.FIRMWARE }}/*
