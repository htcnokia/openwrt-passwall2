name: Sync & Build Slim Packages

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '30 0 * * *' # 每天 UTC 00:30 自動觸發
  workflow_dispatch:

jobs:
  sync-and-build:
    name: Sync, Slim and Build (${{ matrix.target.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          # 中興 ZN M2 (aarch64) 目標架構
          - arch: aarch64_generic
            sdk_ver: "24.10.0"  # 產出 .ipk
          - arch: aarch64_generic
            sdk_ver: "SNAPSHOT" # 產出 .apk (OpenWrt 25+)

    steps:
      # 1. 自動同步 Upstream 上遊最新代碼
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Upstream
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/Openwrt-Passwall/openwrt-passwall2.git || true
          git fetch upstream
          git merge upstream/main --no-edit || git merge upstream/master --no-edit || true

      # 2. 準備 SDK 與 UPX 工具
      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl

      - name: Setup OpenWrt SDK
        uses: openwrt/gh-action-sdk@v7
        with:
          architecture: ${{ matrix.target.arch }}
          sdk_version: ${{ matrix.target.sdk_ver }}

      # 3. 關鍵步驟：把項目拷入 SDK 並執行自訂的 private.sh 進行動態瘦身
      - name: Run Private Slimming Script
        run: |
          # 複製源碼包至 SDK 的 package 目錄
          cp -rb $GITHUB_WORKSPACE/luci-app-passwall2 package/
          cp -rb $GITHUB_WORKSPACE/passwall-depends package/ || true
          
          # 複製並執行 private.sh 腳本
          cp $GITHUB_WORKSPACE/private.sh ./private.sh
          chmod +x ./private.sh
          ./private.sh

      # 4. 執行精簡後的二進位套件編譯
      - name: Compile Slim Packages
        run: |
          make defconfig
          make package/luci-app-passwall2/compile V=s

      # 5. 整理並上傳產出的 ipk / apk 檔案
      - name: Organize Artifacts
        run: |
          mkdir -p ./bin-packages
          find bin/packages/ -type f \( -name "*.ipk" -o -name "*.apk" \) -exec cp {} ./bin-packages/ \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PassWall2-Slim-${{ matrix.target.arch }}-${{ matrix.target.sdk_ver }}
          path: ./bin-packages/*
