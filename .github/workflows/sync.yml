name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 00:00 自動同步
  workflow_dispatch: # 支持手動點擊按鈕觸發

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with Upstream
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/Openwrt-Passwall/openwrt-passwall2.git || true
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit || git merge upstream/master --no-edit
          git push origin main
